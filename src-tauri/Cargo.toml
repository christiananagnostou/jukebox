[package]
name = "jukebox"
version = "0.1.0"
description = "A fast, local-first desktop music player"
authors = ["Christian Anagnostou"]
license = "GPL-3.0-only"
repository = "https://github.com/christiananagnostou/jukebox"
default-run = "jukebox"
edition = "2021"
rust-version = "1.93"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8.9"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22.1"
getrandom = "0.3.4"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
symphonia = { version = "0.5.5", features = ["all"] }
tauri-plugin-dialog = "2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
unicode-normalization = "0.1.25"
md5 = "0.8.0"
sha2 = "0.10.9"
notify = "8.2.0"
tempfile = "3.27.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
