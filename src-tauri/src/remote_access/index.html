<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jukebox" />
    <title>Jukebox</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Jukebox</h1>
        <nav aria-label="Library views">
          <button type="button" data-view="tracks" aria-pressed="true">Tracks</button>
          <button type="button" data-view="albums" aria-pressed="false">Albums</button>
          <button type="button" data-view="artists" aria-pressed="false">Artists</button>
        </nav>
        <form id="search-form" role="search">
          <input id="search" type="search" placeholder="Search title, artist, or album" aria-label="Search library" />
          <button type="submit">Search</button>
        </form>
        <div id="context" hidden>
          <button id="back" type="button">Back</button>
          <strong id="context-label"></strong>
        </div>
        <div class="status-row">
          <p id="status" role="status">Loading library…</p>
          <button id="library-retry" class="quiet-action" type="button" hidden>Retry</button>
        </div>
      </header>
      <section id="items" aria-label="Tracks"></section>
      <button id="load-more" type="button" hidden>Load more</button>
    </main>
    <footer>
      <details id="queue-panel">
        <summary>
          <span id="queue-summary-label">Upcoming</span>
          <span id="queue-count">Queue empty</span>
        </summary>
        <div id="queue-content">
          <div id="queue-items" aria-label="Playback queue"></div>
          <button id="clear-queue" class="quiet-action danger-action" type="button" hidden>Clear queue</button>
        </div>
      </details>
      <section class="player-card" aria-label="Player">
        <div class="playing-copy" aria-live="polite">
          <strong id="now-playing">Nothing playing</strong>
          <span id="now-playing-detail">Choose a track to begin.</span>
        </div>
        <div class="playback-feedback">
          <p id="playback-status" role="status">Queue empty.</p>
          <div id="playback-actions"></div>
        </div>
        <audio id="player" controls preload="metadata"></audio>
      </section>
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
