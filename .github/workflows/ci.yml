name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.12.0
  RUST_TOOLCHAIN: '1.93.0'

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run fmt.check
      - name: Public source portability
        run: npm run check:public-source
      - name: App packaging and identity boundary
        run: npm run check:app-identity
      - name: Desktop security boundary
        run: npm run check:desktop-security
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run build.types
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  tauri:
    name: Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: src-tauri/target/release/Jukebox
          - os: macos-latest
            executable: src-tauri/target/release/Jukebox
          - os: windows-latest
            executable: src-tauri/target/release/Jukebox.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test --locked
        working-directory: src-tauri
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Tauri build
        run: npm run tauri build
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleRoot = 'src-tauri/target/release/bundle'
          $installers = @()
          foreach ($directory in @('msi', 'nsis')) {
            $path = Join-Path $bundleRoot $directory
            if (Test-Path $path) {
              $installers += @(
                Get-ChildItem -Path $path -File -Recurse |
                  Where-Object { $_.Extension -in @('.msi', '.exe') }
              )
            }
          }
          if ($installers.Count -eq 0) {
            throw 'Tauri did not produce an MSI or NSIS installer.'
          }
          $installers | ForEach-Object { Write-Host "Verified installer: $($_.Name)" }
      - name: Bundle portability
        # Installer containers are scanned for literal paths but are not unpacked;
        # the platform executable is always scanned separately.
        run: npm run check:bundle-portability -- "${{ matrix.executable }}" src-tauri/target/release/bundle
